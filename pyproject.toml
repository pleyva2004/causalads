[project]
name = "causalads"
version = "0.1.0"
description = "Customer response modeling, causal incrementality, uplift targeting, and budget optimization for marketing campaigns"
readme = "README.md"
authors = [
    { name = "Pablo Leyva", email = "141463423+pleyva2004@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "econml>=0.17.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pyreadr>=0.5.7",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.49.1",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
]

[project.scripts]
causalads = "causalads.cli:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
